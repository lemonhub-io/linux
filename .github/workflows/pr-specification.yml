name: PR specification

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  specification:
    name: PR specification
    runs-on: ubuntu-latest
    steps:
      - name: Check out the specification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true
      - name: Enforce the specification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_pr_specification.py
